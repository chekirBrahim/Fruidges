function landing(){role='';page='';document.getElementById('root').innerHTML=`<div class="shell"><section class="landinghero"><div><span class="eyebrow">Marketplace agricole internationale</span><h1>Connectons les producteurs, les grossistes et les restaurants.</h1><p>Une plateforme unique pour découvrir les fournisseurs sur une carte mondiale, commercialiser les produits agricoles et sécuriser le suivi des commandes.</p><div class="actions"><button class="btn white" onclick="requestModal()">Demander un accès →</button><button class="btn alt" onclick="enter('acheteur','carte')">Voir la démonstration 🌍</button></div></div></section><div class="section"><h2>Une plateforme, trois métiers</h2><span class="muted">L'accès est accordé par l'administrateur</span></div><div class="grid three">${[['🚜','Fournisseurs','Publiez vos produits et répondez aux commandes.'],['🛒','Acheteurs / Grossistes','Achetez aux producteurs puis revendez aux restaurants.'],['🍽️','Restaurants','Commandez auprès des grossistes référencés.']].map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn alt sm" onclick="requestModal()">Demander l’accès →</button></div>`).join('')}</div><div class="section"><h2>Comment ça fonctionne ?</h2></div><div class="grid">${[['01','Demande d’accès','Le professionnel renseigne le formulaire public.'],['02','Validation','L’administrateur contrôle et crée le compte.'],['03','Mise en relation','Carte des pays, fiches et catalogues.'],['04','Transactions','Commandes et suivi centralisé.']].map(x=>`<div class="card"><div class="number">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="section"><h2>Une chaîne d’approvisionnement connectée</h2></div><div class="card"><div class="flow"><span>🚜 Fournisseur agricole</span> → <span>🛒 Acheteur / Grossiste</span> → <span>🍽️ Restaurant</span></div><p>Le grossiste est acheteur auprès des producteurs et devient fournisseur dans le catalogue réservé aux restaurants.</p></div><div class="footer">Fruidges · Prototype commercial · Données et transactions fictives</div></div>`}
const menus={admin:[['dashboard','Vue globale'],['demandes','Demandes d’accès'],['comptes','Comptes et habilitations'],['produits','Produits et annonces'],['commandes','Toutes les commandes'],['statistiques','Statistiques']],fournisseur:[['dashboard','Tableau de bord'],['produits','Mes produits'],['ajouter','Ajouter un produit'],['commandes','Commandes reçues']],acheteur:[['dashboard','Tableau de bord'],['carte','Carte mondiale'],['catalogue','Acheter aux producteurs'],['vente','Vendre aux restaurants'],['panier','Mon panier'],['commandes','Mes commandes']],restaurant:[['dashboard','Tableau de bord'],['carte','Carte des grossistes'],['catalogue','Catalogue grossistes'],['panier','Mon panier'],['commandes','Mes commandes']]};function enter(r,p){role=r;page=p||'dashboard';render()}function go(p){page=p;render()}function wrap(content){document.getElementById('root').innerHTML=`<div class="app"><aside><h3>${names[role]}</h3>${menus[role].map(([id,n])=>`<button class="${id===page?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}</aside><main class="workspace">${content}<div class="footer">Fruidges · Simulation interactive, données fictives, sans serveur ni paiement réel</div></main></div>`}function heading(t,s){return `<div class="section" style="margin-top:0"><div><h2>${t}</h2><div class="muted">${s}</div></div></div>`}function hero(t,s){return `<div class="workhero"><span class="eyebrow">${names[role]}</span><h1>${t}</h1><p>${s}</p></div>`}function stats(arr){return `<div class="stats">${arr.map(([a,b])=>`<div class="card"><b>${a}</b><small>${b}</small></div>`).join('')}</div>`}function table(headers,rows){return `<div class="tablebox"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Aucune donnée</td></tr>`}</tbody></table></div>`}function status(s){return `<span class="tag ${s==='En attente'?'wait':''}">${esc(s)}</span>`}function productCards(list,mode){return `<div class="grid">${list.map(p=>`<div class="card product"><img src="${p.img}" alt="${esc(p.name)}"><div class="body"><h3>${esc(p.name)}</h3><p>${esc(byId(p.owner)?.name||'Compte inconnu')} · ${esc(byId(p.owner)?.city||'')}</p><b>${money(p.price)} / kg</b><p>Stock : ${p.stock} kg</p>${mode==='buy'?`<button class="btn sm" onclick="addBasket(${p.id})">Ajouter au panier +</button>`:''}</div></div>`).join('')||'<div class="card">Aucun produit disponible.</div>'}</div>`}function addBasket(id){let x=basket.find(i=>i.id===id);if(x)x.qty+=1;else basket.push({id,qty:1});showToast('Produit ajouté au panier')}
function adminPage(){if(page==='dashboard')return hero('Centre de contrôle','L’administrateur crée les comptes et supervise tous les acteurs, demandes, produits et transactions.')+stats([[accounts.length,'Comptes créés'],[requests.filter(r=>r.status==='En attente').length,'Demandes à traiter'],[products.length,'Produits publiés'],[orders.length,'Commandes suivies']])+`<div class="grid three"><div class="card"><h3>🔐 Accès professionnels</h3><p>Vérifier les demandes et créer les comptes.</p><button class="btn" onclick="go('demandes')">Gérer les demandes</button></div><div class="card"><h3>👥 Gestion des acteurs</h3><p>Ajouter, activer ou suspendre les utilisateurs.</p><button class="btn" onclick="go('comptes')">Gérer les comptes</button></div><div class="card"><h3>📦 Supervision</h3><p>Contrôler l’ensemble des transactions.</p><button class="btn" onclick="go('commandes')">Voir les commandes</button></div></div>`;if(page==='demandes')return heading('Demandes d’accès','Demandes reçues depuis le formulaire de la page d’accueil')+table(['Organisation','Profil','Pays / Ville','Statut','Actions'],requests.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="mini muted">${esc(r.email)}</div></td><td>${names[r.type]}</td><td>${esc(r.country)} / ${esc(r.city)}</td><td>${status(r.status)}</td><td><div class="actions">${r.status==='En attente'?`<button class="btn sm" onclick="approve(${r.id})">Approuver & créer</button><button class="btn alt sm" onclick="reject(${r.id})">Refuser</button>`:'—'}</div></td></tr>`));if(page==='comptes')return heading('Comptes et habilitations','Création exclusivement par l’administrateur, activation et suspension')+`<button class="btn" onclick="createAccountModal()">＋ Créer un compte</button>`+table(['Organisation','Rôle','Localisation','État','Gestion'],accounts.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="mini muted">${esc(a.email)}</div></td><td>${names[a.type]}</td><td>${esc(a.city)} · ${esc(a.country)}</td><td>${status(a.status)}</td><td><button class="btn alt sm" onclick="toggleAccount(${a.id})">${a.status==='Actif'?'Suspendre':'Activer'}</button></td></tr>`));if(page==='produits')return heading('Produits et annonces','Visibilité sur les catalogues fournisseurs et grossistes')+table(['Produit','Publié par','Marché','Prix','Statut'],products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(byId(p.owner)?.name)}</td><td>${byId(p.owner)?.type==='acheteur'?'Restaurants':'Acheteurs'}</td><td>${money(p.price)}</td><td>${status('Publié')}</td></tr>`));if(page==='commandes')return heading('Toutes les commandes','Traçabilité des deux circuits commerciaux')+orderTable(orders,true);return heading('Statistiques globales','Suivi du réseau et de la chaîne commerciale')+stats([[activeAccounts('fournisseur').length,'Fournisseurs actifs'],[activeAccounts('acheteur').length,'Acheteurs / Grossistes'],[activeAccounts('restaurant').length,'Restaurants actifs'],[orders.filter(o=>o.channel==='Restauration').length,'Commandes restaurants']])+`<div class="card"><h3>Flux de la plateforme</h3><div class="flow"><span>Fournisseurs</span> → <span>Acheteurs / Grossistes</span> → <span>Restaurants</span></div><p>Dans le produit final, ce tableau de bord pourra intégrer filtres, exports, audit des actions et indicateurs financiers.</p></div>`}
function approve(id){let r=requests.find(x=>x.id===id);if(!r)return;accounts.push({id:++seq,name:r.name,type:r.type,country:r.country,city:r.city,email:r.email,status:'Actif'});r.status='Approuvée';showToast('Compte créé et activé (simulation)');render()}function reject(id){requests.find(x=>x.id===id).status='Refusée';render()}function toggleAccount(id){let a=byId(id);a.status=a.status==='Actif'?'Suspendu':'Actif';render()}function createAccountModal(){openModal('Créer un compte professionnel',`<form class="form" onsubmit="createAccount(event)"><div class="field"><label>Entreprise *</label><input name="name" required></div><div class="field"><label>Profil *</label><select name="type"><option value="fournisseur">Fournisseur</option><option value="acheteur">Acheteur / Grossiste</option><option value="restaurant">Restaurant</option></select></div><div class="field"><label>E-mail *</label><input type="email" name="email" required></div><div class="field"><label>Pays</label><select name="country"><option value="TN">Tunisie</option><option value="FR">France</option><option value="MA">Maroc</option></select></div><div class="field"><label>Ville *</label><input name="city" required></div><div class="field full"><button class="btn">Créer et activer le compte</button></div></form>`)}function createAccount(e){e.preventDefault();accounts.push({...Object.fromEntries(new FormData(e.target)),id:++seq,status:'Actif'});closeModal();go('comptes');showToast('Compte créé par l’administrateur')}
function orderTable(list,full){return table(['Commande','Acheteur','Vendeur','Produit','Quantité','Statut',...(full?['Action']:[])],list.map(o=>`<tr><td>#${o.id}<div class="mini muted">${o.channel}</div></td><td>${esc(o.buyer)}</td><td>${esc(o.seller)}</td><td>${esc(o.product)}</td><td>${o.qty} kg</td><td>${status(o.status)}</td>${full?`<td><button class="btn alt sm" onclick="advanceOrder(${o.id})">Avancer statut</button></td>`:''}</tr>`))}function advanceOrder(id){let o=orders.find(x=>x.id===id),s=['Nouvelle','Confirmée','En préparation','Expédiée','Livrée'];o.status=s[Math.min(s.length-1,Math.max(0,s.indexOf(o.status))+1)];render()}
function sellerPage(){if(page==='dashboard')return hero('Vendez votre production','Vos produits sont visibles aux acheteurs / grossistes, pas directement dans le catalogue restaurant.')+stats([[products.filter(p=>byId(p.owner)?.type==='fournisseur').length,'Références agricoles'],[orders.filter(o=>o.channel==='B2B').length,'Commandes B2B'],[activeAccounts('acheteur').length,'Grossistes actifs'],[activeAccounts('fournisseur').length,'Producteurs actifs']])+`<button class="btn" onclick="go('ajouter')">Ajouter un produit →</button>`;if(page==='produits')return heading('Catalogue fournisseur','Produits commercialisés vers les acheteurs / grossistes')+productCards(products.filter(p=>byId(p.owner)?.type==='fournisseur'),'');if(page==='ajouter')return productForm('fournisseur');return heading('Commandes reçues','Les grossistes commandent aux fournisseurs agricoles')+orderTable(orders.filter(o=>o.channel==='B2B'),true)}function productForm(type){return heading('Publier un produit',type==='acheteur'?'Offre grossiste destinée aux restaurants':'Offre producteur destinée aux acheteurs')+`<div class="card"><form class="form" onsubmit="publish(event,'${type}')"><div class="field"><label>Nom du produit</label><input name="name" required placeholder="Ex. Tomates bio"></div><div class="field"><label>Prix FCFA / kg</label><input name="price" type="number" min="1" required></div><div class="field"><label>Stock (kg)</label><input name="stock" type="number" min="1" required></div><div class="field"><label>Image du produit</label><select name="img"><option value="tomate">Tomates</option><option value="olive">Olives</option><option value="orange">Oranges</option><option value="carotte">Carottes</option><option value="salade">Salades</option></select></div><div class="field full"><button class="btn">Publier le produit</button></div></form></div>`}function publish(e,type){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let owner=activeAccounts(type)[0];if(!owner){showToast('Créer d’abord un compte '+type);return}products.unshift({id:++seq,name:d.name,price:+d.price,stock:+d.stock,img:photos[d.img],owner:owner.id});showToast('Produit publié (simulation)');go(type==='acheteur'?'vente':'produits')}
function buyerPage(){if(page==='dashboard')return hero('Achetez aux producteurs, revendez aux restaurants','Double activité : acheteur dans le marché agricole et fournisseur dans le marché restauration.')+stats([[activeAccounts('fournisseur').length,'Producteurs actifs'],[activeAccounts('restaurant').length,'Restaurants actifs'],[products.filter(p=>byId(p.owner)?.type==='acheteur').length,'Offres grossistes'],[orders.filter(o=>o.channel==='B2B').length,'Achats producteurs']])+`<div class="grid three"><div class="card"><h3>🌍 Trouver des producteurs</h3><p>Choisissez un pays et découvrez les fournisseurs.</p><button class="btn" onclick="go('carte')">Carte mondiale</button></div><div class="card"><h3>🛒 Acheter en gros</h3><p>Constituez votre panier de produits agricoles.</p><button class="btn" onclick="go('catalogue')">Catalogue</button></div><div class="card"><h3>🍽️ Revendre aux restaurants</h3><p>Publiez votre propre offre grossiste.</p><button class="btn" onclick="go('vente')">Mes offres</button></div></div>`;if(page==='carte')return mapPage('fournisseur');if(page==='catalogue')return heading('Catalogue des producteurs','Les fournisseurs agricoles approvisionnent les acheteurs / grossistes')+productCards(allOffers().filter(p=>byId(p.owner)?.type==='fournisseur'),'buy');if(page==='vente')return heading('Mes offres pour les restaurants','En tant qu’acheteur / grossiste, vous êtes fournisseur pour les restaurants')+`<button class="btn" onclick="openModal('Nouvelle offre grossiste',${JSON.stringify('')} )" style="display:none"></button><button class="btn" onclick="go('publier')">＋ Publier une offre restaurant</button><div class="notice">Les produits ci-dessous sont exclusivement visibles dans l’espace Restaurant.</div>`+productCards(products.filter(p=>byId(p.owner)?.type==='acheteur'),'');if(page==='publier')return productForm('acheteur');if(page==='panier')return basketPage();return heading('Mes commandes','Achats auprès des producteurs et ventes aux restaurants')+orderTable(orders.filter(o=>o.channel==='B2B'||o.channel==='Restauration'),true)}
function restaurantPage(){if(page==='dashboard')return hero('Approvisionnez votre restaurant','Retrouvez les offres des acheteurs / grossistes agréés, et commandez en quelques clics.')+stats([[activeAccounts('acheteur').length,'Grossistes partenaires'],[products.filter(p=>byId(p.owner)?.type==='acheteur').length,'Offres restaurants'],[orders.filter(o=>o.channel==='Restauration').length,'Commandes restaurants'],[countries.filter(c=>activeAccounts('acheteur').some(a=>a.country===c.code)).length,'Pays disponibles']])+`<button class="btn" onclick="go('carte')">🌍 Explorer les grossistes</button>`;if(page==='carte')return mapPage('acheteur');if(page==='catalogue')return heading('Catalogue des grossistes','Seules les offres publiées par les acheteurs / grossistes sont affichées')+productCards(allOffers().filter(p=>byId(p.owner)?.type==='acheteur'),'buy');if(page==='panier')return basketPage();return heading('Commandes restaurant','Les grossistes assurent la vente aux restaurants')+orderTable(orders.filter(o=>o.channel==='Restauration'),false)}
function basketPage(){let allowed=allOffers().filter(p=>byId(p.owner)?.type===(role==='restaurant'?'acheteur':'fournisseur'));let lines=basket.filter(x=>allowed.some(p=>p.id===x.id));return heading('Mon panier','Validation simulée des commandes')+`<div class="card">${lines.length?lines.map(x=>{let p=products.find(p=>p.id===x.id);return `<div style="display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e6eee7"><span>${esc(p.name)} · ${x.qty} kg</span><b>${money(p.price*x.qty)}</b></div>`}).join('')+`<h3>Total : ${money(lines.reduce((n,x)=>n+products.find(p=>p.id===x.id).price*x.qty,0))}</h3><button class="btn" onclick="checkout()">Confirmer la commande →</button>`:'Votre panier est vide pour ce marché. Ajoutez des produits depuis le catalogue.'}</div>`}function checkout(){let allowedType=role==='restaurant'?'acheteur':'fournisseur';let client=role==='restaurant'?'Restaurant Le Jardin':'Marché Méditerranée';let lines=basket.filter(x=>byId(products.find(p=>p.id===x.id)?.owner)?.type===allowedType);lines.forEach(x=>{let p=products.find(p=>p.id===x.id);orders.unshift({id:++seq,buyer:client,seller:byId(p.owner).name,product:p.name,qty:x.qty,status:'Nouvelle',channel:role==='restaurant'?'Restauration':'B2B'})});basket=basket.filter(x=>!lines.includes(x));showToast('Commande enregistrée dans la démonstration');go('commandes')}
function mapPage(t){selectedCountry='';selectedCity='';let c=countries.map(x=>{let n=activeAccounts(t).filter(a=>a.country===x.code).length;return `<button class="country" onclick="chooseCountry('${x.code}','${t}')">${x.flag} <b>${x.name}</b> <span class="count">${n}</span></button>`}).join('');return heading('Carte mondiale des '+(t==='acheteur'?'grossistes':'fournisseurs'),'Cliquez sur le nombre affiché sur un pays pour voir ses professionnels')+`<div class="card"><div id="map"></div><div class="grid three" style="margin-top:15px">${c}</div><div id="geoResults" style="margin-top:22px"></div></div><div class="notice">Le chiffre correspond aux comptes actifs du pays et du rôle sélectionné. Les chiffres évoluent après création ou suspension d’un compte dans l’espace administrateur.</div>`}function chooseCountry(code,t){selectedCountry=code;selectedCity='';let c=countries.find(x=>x.code===code),people=activeAccounts(t).filter(a=>a.country===code);if(map)map.setView([c.lat,c.long],5);document.getElementById('geoResults').innerHTML=`<h2>${c.flag} ${c.name} — ${people.length} professionnel(s)</h2><div class="actions">${[...new Set(people.map(a=>a.city))].map(city=>`<button class="btn alt sm" onclick="chooseCity('${esc(city)}','${t}')">📍 ${esc(city)} · ${people.filter(a=>a.city===city).length}</button>`).join('')||'Aucun compte actif dans ce pays.'}</div><div id="cityResults" style="margin-top:15px"></div>`}function chooseCity(city,t){let people=activeAccounts(t).filter(a=>a.country===selectedCountry&&a.city===city);document.getElementById('cityResults').innerHTML=`<div class="grid three">${people.map(a=>`<div class="card"><span class="tag">Compte vérifié</span><h3>${esc(a.name)}</h3><p>📍 ${esc(a.city)}</p><p>${products.filter(p=>p.owner===a.id).length} produit(s) au catalogue</p><button class="btn sm" onclick="viewSupplier(${a.id})">Voir les produits →</button></div>`).join('')}</div><div id="supplierResults" style="margin-top:20px"></div>`}function viewSupplier(id){let a=byId(id);document.getElementById('supplierResults').innerHTML=`<h2>Catalogue — ${esc(a.name)}</h2>${productCards(allOffers().filter(p=>p.owner===id),'buy')}`}
function initMap(){let el=document.getElementById('map');if(!el)return;if(!window.L){el.innerHTML='<div class="alert">La carte nécessite Internet. Utilisez les pays ci-dessous.</div>';return}map=L.map('map',{scrollWheelZoom:false}).setView([26,10],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:10}).addTo(map);let t=role==='restaurant'?'acheteur':'fournisseur';countries.forEach(c=>{let n=activeAccounts(t).filter(a=>a.country===c.code).length;if(!n)return;let icon=L.divIcon({className:'',html:`<div class="mapbadge">${n}</div>`,iconSize:[45,45],iconAnchor:[22,22]});L.marker([c.lat,c.long],{icon}).addTo(map).bindTooltip(c.name+' : '+n).on('click',()=>chooseCountry(c.code,t))});setTimeout(()=>map?.invalidateSize(),120)}function render(){if(map){map.remove();map=null}let content=role==='admin'?adminPage():role==='fournisseur'?sellerPage():role==='acheteur'?buyerPage():restaurantPage();wrap(content);if(page==='carte')setTimeout(initMap,60)}
// Fruidges V4 : catalogue bilingue, pagination, devis Word et WhatsApp.
const buyerLabels={1:['Fresh Tomatoes','طماطم طازجة'],2:['Olive Oil','زيت الزيتون'],3:['Fresh Oranges','برتقال طازج'],4:['Fresh Carrots','جزر طازج'],5:['Fresh Lettuce','خس طازج'],6:['Wholesale Tomatoes','طماطم بالجملة']};
let catalogSize=10,catalogIndex=0,catalogSearch='',lastReceipt=null;
const fxUSD=600,fxKWD=0.307; // taux fictifs de démonstration, NON cotations en direct
function usd(v){return '$'+(Number(v)/fxUSD).toFixed(2)}
function kwd(v){return 'KD '+(Number(v)/fxUSD*fxKWD).toFixed(3)}
function biling(p){return buyerLabels[p.id]||[p.name,p.name]}
function zoomPhoto(id){let p=products.find(x=>x.id===id);if(!p)return;document.getElementById('photoZoom').innerHTML=`<img src="${p.img}" alt="${esc(biling(p)[0])}"><div style="color:white;margin:12px">${esc(biling(p)[0])} · ${esc(biling(p)[1])}</div><button class="btn" onclick="document.getElementById('photoZoom').classList.remove('show')">Fermer ✕</button>`;document.getElementById('photoZoom').classList.add('show')}
function catalogBilingual(){let items=allOffers().filter(p=>byId(p.owner)?.type==='fournisseur');let q=catalogSearch.toLowerCase().trim();if(q)items=items.filter(p=>[p.name,...biling(p),byId(p.owner)?.name||''].join(' ').toLowerCase().includes(q));let pages=Math.max(1,Math.ceil(items.length/catalogSize));catalogIndex=Math.min(catalogIndex,pages-1);let shown=items.slice(catalogIndex*catalogSize,(catalogIndex+1)*catalogSize);return heading('International Produce Marketplace | سوق المنتجات','Catalogue acheteur · Produits en anglais et en arabe · Prix USD et dinar koweïtien')+`<div class="card catalog-shell"><div class="catalog-toolbar"><input id="catalogQuery" placeholder="Search / بحث عن منتج" value="${esc(catalogSearch)}" oninput="catalogSearch=this.value;catalogIndex=0;refreshCatalog()"><label>Produits par page <select onchange="catalogSize=+this.value;catalogIndex=0;refreshCatalog()">${[10,20,30,50].map(n=>`<option value="${n}" ${catalogSize===n?'selected':''}>${n}</option>`).join('')}</select></label><span class="pill-qty">${items.length} produit(s)</span></div><div id="catalogRows">${shown.map(p=>{let names=biling(p);return `<div class="lot-row"><img src="${p.img}" alt="${esc(names[0])}" onclick="zoomPhoto(${p.id})" title="Agrandir la photo"><div><h3>${esc(names[0])}</h3><div class="dual-name" lang="ar" dir="rtl">${esc(names[1])}</div><p>${esc(byId(p.owner)?.name||'')} · ${esc(byId(p.owner)?.city||'')}</p><div class="lot-price">${usd(p.price)} <small>/ kg · ${kwd(p.price)} / kg</small></div><p>Stock: ${p.stock} kg · <small>📦 Lot #${p.id.toString().padStart(5,'0')}</small></p></div><div class="lot-actions"><button class="btn alt sm" onclick="zoomPhoto(${p.id})">🔎 Image</button><button class="btn sm" onclick="addBasket(${p.id});showToast('Ajouté au panier')">＋ Panier</button></div></div>`}).join('')||'<p>Aucun produit correspondant.</p>'}</div><div class="pagination"><button class="btn alt sm" ${catalogIndex===0?'disabled':''} onclick="catalogIndex--;refreshCatalog()">←</button><span>Page ${catalogIndex+1} / ${pages}</span><button class="btn alt sm" ${catalogIndex>=pages-1?'disabled':''} onclick="catalogIndex++;refreshCatalog()">→</button></div><div class="price-note">Démonstration : conversion indicative sur base fictive 1 USD = 600 FCFA et 1 USD = 0,307 KWD. À remplacer par les prix fournisseurs et un taux de change réel en production.</div></div><div style="margin-top:15px"><button class="btn" onclick="go('panier')">🛒 Voir mon panier (${basket.length} références)</button></div>`}

function v7TranslateDOM(root){if(uiLang!=='ar')return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(!node.parentElement||['SCRIPT','STYLE','OPTION'].includes(node.parentElement.tagName)||node.parentElement.closest('.dual-name'))continue;let raw=node.textContent;let val=raw.trim();if(!val)continue;let exact=translationPairs.find(([en])=>val===en);if(exact){node.textContent=raw.replace(val,tr(exact[1]));continue}for(let [en,key] of translationPairs){if(val.startsWith(en+' ')||val.startsWith(en+' →')){node.textContent=raw.replace(en,tr(key));break}}}root.querySelectorAll('input[placeholder]').forEach(i=>{if(/pays|country/i.test(i.placeholder))i.placeholder=tr('search');});}

}

async function v8ReadFile(ev){let file=ev.target.files?.[0];if(!file)return;try{if(typeof XLSX==='undefined')throw new Error('Excel reader unavailable. Internet connection required.');let data=await file.arrayBuffer();let book=XLSX.read(data,{type:'array'});let rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:null});let headerIndex=rows.findIndex(r=>r.some(v=>String(v||'').trim().toLowerCase()==='category')&&r.some(v=>String(v||'').trim().toLowerCase()==='product'));if(headerIndex<0)throw new Error('Category / Product columns not found');let h=rows[headerIndex].map(v=>String(v||'').trim().toLowerCase());let at=k=>h.findIndex(z=>z.includes(k));let ci=at('category'),pi=at('product'),ai=at('arabic'),si=at('size/pack'),wi=at('net box weight'),fi=at('photos'),au=at('price cif'),kb=at('landed cost  (kd/box)'),kg=at('landed cost (kd/kg)');if(kb<0)kb=9;if(kg<0)kg=10;let imported=rows.slice(headerIndex+1).filter(r=>r[pi]).slice(0,50).map((r,i)=>({id:800+i,category:String(r[ci]||''),photo:String(r[fi]||''),name:String(r[pi]),arabic:String(r[ai]||'').startsWith('#')?'—':String(r[ai]||'—'),size:String(r[si]||''),weight:Number(r[wi])||1,aud:Number(r[au])||0,kdbox:Number(r[kb])||0,kdkg:Number(r[kg])||0}));if(!imported.length)throw new Error('No product rows found');v8Rows=imported;v8SeedProducts();render();showToast(imported.length+' products imported (demo only)')}catch(e){alert('Import failed: '+e.message)}}
