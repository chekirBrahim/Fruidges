function requestsPage(){return `<section class="panel"><h2>${tx('requestTitle')}</h2><p class="muted">${tx('demo')}</p><form class="request-form" onsubmit="submitAccess(event)"><label>${tx('company')}<input required name="company" maxlength="90"></label><label>${tx('contact')}<input required name="email" type="email"></label><label>${tx('role')}<select name="role"><option value="supplier">${t('supplier')}</option><option value="buyer">${t('buyer')}</option><option value="restaurant">${tx('restaurant')}</option></select></label><button class="primary" type="submit">${tx('submit')}</button></form></section>`}
function submitAccess(e){e.preventDefault();let f=new FormData(e.target);accessRequests.unshift({company:String(f.get('company')),email:String(f.get('email')),role:String(f.get('role')),status:'Pending'});alert(tx('requestSent'));setView('home')}
function adminExtra(){return `<section class="panel"><h2>${tx('requests')} (${accessRequests.length})</h2>${accessRequests.length?accessRequests.map((r,i)=>`<div class="request-row"><strong>${esc(r.company)}</strong> · ${esc(r.email)} · ${esc(r.role)} · ${esc(r.status)} <button onclick="accessRequests[${i}].status='Approved';render()">${tx('approve')}</button><button onclick="accessRequests[${i}].status='Rejected';render()">${tx('reject')}</button></div>`).join(''):`<p class="muted">0 ${tx('requests')}</p>`}</section>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('nav-buyer').textContent=t('buyer');document.getElementById('cartLabel').textContent=t('cart');document.getElementById('cartCount').textContent=totalQty();document.getElementById('langBtn').textContent=lang==='en'?'العربية':'English';['buyer'].forEach(k=>document.getElementById('nav-'+k).classList.toggle('active',view===k));document.getElementById('root').innerHTML=(view==='home'?home():view==='buyer'?buyer():view==='restaurant'?restaurant():view==='requests'?requestsPage():view==='supplier'?supplier():view==='admin'?admin()+adminExtra():view==='cart'?cart():receipt())+`<div class="footer">Fruidges · ${t('note')}</div>`}view='buyer';render();
</script><script>
if(location.hash !== '#demo-buyer') location.replace('demo.html');
</script></body></html>
